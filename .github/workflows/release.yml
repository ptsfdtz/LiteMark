name: 'publish'

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  validate:
    name: Validate release
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  publish-tauri:
    needs: validate
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: install Rust
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master, 2026-07-14
        with:
          toolchain: 1.96.0
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: install Linux dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.0-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: install frontend dependencies
        run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@fce9c6108b31ea247710505d3aaaa893ee6768d4 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_V3 }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD_V3 }}
        with:
          tagName: v__VERSION__
          releaseName: 'LiteMark v__VERSION__'
          releaseBody: |
            LiteMark v__VERSION__ adds signed over-the-air updates and preserves sidebar states across app restarts.

            ## Fixes and improvements
            - Checks for signed updates at startup and installs them with download progress and a restart.
            - Protects unsaved documents before installing an update.
            - Restores the File Explorer and Agent sidebar open or closed states on later launches.

            ## Validation
            - Added regression coverage for updater behavior and File Explorer visibility.
            - Builds remain available for Windows, Linux, Intel Mac, and Apple Silicon Mac.

            Full bilingual release notes: https://github.com/ptsfdtz/LiteMark/blob/v__VERSION__/RELEASE_NOTES.md

            ---

            LiteMark v__VERSION__ 新增带签名的 OTA 自动更新，可显示下载进度并在安装后重启；同时会在后续启动时恢复文件栏和 Agent 侧边栏的展开或关闭状态。

            请在下方 Assets 区域下载对应平台的安装包或压缩包。完整中英文说明请查看上方链接。
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
