name: 'publish'

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  validate:
    name: Validate release
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  publish-tauri:
    needs: validate
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: install Rust
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master, 2026-07-14
        with:
          toolchain: 1.96.0
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: install Linux dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.0-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: install frontend dependencies
        run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@fce9c6108b31ea247710505d3aaaa893ee6768d4 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'LiteMark v__VERSION__'
          releaseBody: |
            LiteMark 2.1.3 is a focused stability and rendering update.

            ## Fixes and improvements
            - Fixed HTML images inside Markdown table cells not rendering in the WYSIWYG editor.
            - Resolved local relative image paths consistently in both the editor and preview.
            - Fixed the entire interface becoming blank after closing the final open file.
            - Unified standalone-file and folder-root row sizing, selection backgrounds, spacing, and remove-button behavior in the file explorer.
            - Preserved original relative image paths so rendering never writes Tauri asset URLs back into Markdown files.

            ## Validation
            - Added regression coverage for table images, path changes, and the empty-editor state.
            - Verified the fixes in the real Tauri desktop window.
            - Builds remain available for Windows, Linux, Intel Mac, and Apple Silicon Mac.

            Full bilingual release notes: https://github.com/ptsfdtz/LiteMark/blob/v2.1.3/RELEASE_NOTES.md

            ---

            LiteMark 2.1.3 是一次专注稳定性与 Markdown 渲染的维护更新，修复表格内图片不显示、本地相对图片路径解析不一致、关闭最后一个文件后整页空白等问题，并统一左侧单文件与文件夹项目的交互样式。

            请在下方 Assets 区域下载对应平台的安装包或压缩包。完整中英文说明请查看上方链接。
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
