name: 'publish'

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  validate:
    name: Validate release
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  publish-tauri:
    needs: validate
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: install Rust
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master, 2026-07-14
        with:
          toolchain: 1.96.0
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: install Linux dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.0-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: install frontend dependencies
        run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@fce9c6108b31ea247710505d3aaaa893ee6768d4 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'LiteMark v__VERSION__'
          releaseBody: |
            LiteMark 2.1.2 is a substantial workspace, editing, and AI-assistance update.

            ## Highlights
            - A more capable file explorer with lazy loading, animated expansion, folder creation, inline renaming, deletion, path copying, and system file-manager integration.
            - Consistent context menus across files, folders, tabs, recent files, the editor, Markdown previews, images, PDFs, AI conversations, and layout areas.
            - Improved tab workflows with Close Others, Close All, Reopen Closed File, and smoother animations.
            - A redesigned AI workspace with persistent conversations, archive and restore actions, resumable runs, plans, permission controls, and safer project tools.
            - Better large-document performance and bounded scanning for very large projects.

            ## Reliability
            - Expanded frontend and Rust test coverage.
            - Stricter formatting, linting, type, Clippy, version, and dependency checks.
            - Safer atomic storage, deletion, and no-overwrite rename behavior.
            - Builds for Windows, Linux, Intel Mac, and Apple Silicon Mac.

            Full bilingual release notes: https://github.com/ptsfdtz/LiteMark/blob/v2.1.2/RELEASE_NOTES.md

            ---

            LiteMark 2.1.2 是一次覆盖工作区、编辑体验和 AI 助手的重要更新，新增全局右键快捷操作、文件夹创建后就地重命名、文件树动画、标签页批量操作、AI 会话持久化与恢复，并改善大型文档和大型目录性能。

            请在下方 Assets 区域下载对应平台的安装包或压缩包。完整中英文说明请查看上方链接。
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
